name: CI Pipeline

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  validate:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20 LTS
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install root & workspace dependencies
        run: npm ci

      - name: Build Shared Types & Schemas
        run: npm run build --workspace=@csf/shared

      - name: Run Server Unit & Integration Tests
        run: npm --prefix server test
        env:
          NODE_ENV: test
          MONGODB_URI: mongodb://localhost:27017/csf_livebook_test
          JWT_ACCESS_SECRET: test_jwt_access_secret_min_32_chars_ci
          JWT_REFRESH_SECRET: test_jwt_refresh_secret_min_32_chars_ci

      - name: Build Client Webpack/Vite Bundle
        run: npm --prefix client run build

      - name: Build Server Distribution
        run: npm --prefix server run build
